[project]
name = "gestao-restaurantes"
version = "2.4.0"
description = "Sistema de gestão de restaurantes para fins académicos"
authors = [
    {name = "Grupo6MADS"}
]
requires-python = ">=3.8"

dependencies = [
    "pandas",
    "matplotlib",
    "folium"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
